# Reference CSMSs for local work. Ports are published on loopback only: these
# are unauthenticated OCPP servers (security profile 0 by default) that accept
# any station the fixture lists, and must not be reachable from anywhere else.
#
#   docker compose up -d --wait        # every server, waits for readiness
#   docker compose down
#
# A station connects to ws://127.0.0.1:<port>/ocpp/<station identity>.
# OCPP_INTEROP_VERSION selects the image tag (default: dev, the local build);
# OCPP_INTEROP_OCPP the OCPP version (default 1.6), with
# OCPP_INTEROP_FIXTURE_DIR its fixture directory (default v16; v201 for
# 2.0.1, v21 for 2.1); OCPP_INTEROP_FIXTURE a baked fixture (default: baseline):
#
#   OCPP_INTEROP_OCPP=2.0.1 OCPP_INTEROP_FIXTURE_DIR=v201 docker compose up -d --wait
#
# OCPP 2.1 is served by mobilityhouse only (the others exit 5):
#
#   OCPP_INTEROP_OCPP=2.1 OCPP_INTEROP_FIXTURE_DIR=v21 docker compose up -d --wait mobilityhouse
#
# everest (EVerest libocpp) is a station only. The `station` profile runs it
# as `client run` against the mobilityhouse CSMS; send its CALLs with
#   docker compose exec everest ocpp-interop call Heartbeat
#
#   docker compose --profile station up -d --wait mobilityhouse everest

x-server: &server
  command: ["server", "--version", "${OCPP_INTEROP_OCPP:-1.6}",
            "--fixture", "/fixtures/${OCPP_INTEROP_FIXTURE_DIR:-v16}/${OCPP_INTEROP_FIXTURE:-baseline}/fixture.json"]
  healthcheck:
    test: ["CMD", "test", "-f", "/run/ocpp-interop/ready"]
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 20s
  stop_grace_period: 15s

name: ocpp-interop
services:
  mobilityhouse:
    <<: *server
    image: ghcr.io/otfabric/ocpp-interop-mobilityhouse:${OCPP_INTEROP_VERSION:-dev}
    ports:
      - "127.0.0.1:9000:9000"

  chargetime:
    <<: *server
    image: ghcr.io/otfabric/ocpp-interop-chargetime:${OCPP_INTEROP_VERSION:-dev}
    ports:
      - "127.0.0.1:9001:9000"

  lorenzodonini:
    <<: *server
    image: ghcr.io/otfabric/ocpp-interop-lorenzodonini:${OCPP_INTEROP_VERSION:-dev}
    ports:
      - "127.0.0.1:9002:9000"

  everest:
    image: ghcr.io/otfabric/ocpp-interop-everest:${OCPP_INTEROP_VERSION:-dev}
    profiles: ["station"]
    command: ["client", "run", "--version", "${OCPP_INTEROP_OCPP:-1.6}",
              "--url", "ws://mobilityhouse:9000/ocpp",
              "--fixture", "/fixtures/${OCPP_INTEROP_FIXTURE_DIR:-v16}/${OCPP_INTEROP_FIXTURE:-baseline}/fixture.json"]
    depends_on:
      mobilityhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/run/ocpp-interop/ready"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 20s
    stop_grace_period: 15s
