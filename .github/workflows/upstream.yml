name: Upstream
run-name: "Upstream check (${{ github.event_name }})"

# Daily check of every pin against the latest upstream: the release of every
# stack (scripts/latest-upstream.py) and the digest of every base image. Where
# an adapter is built (adapters/<name>/Dockerfile exists) and its pin is
# behind, a candidate image is built at the latest release and self-tested
# (once per pin -> latest pair; later runs reuse that result). While an
# adapter is only planned, its "pin" is the release recorded as `latest:` in
# versions.yaml, and the check says whether that record is stale; nothing is
# built. The table goes to the Job Summary and to the issue "Upstream
# releases: pins behind the latest", which is opened or updated (with a
# comment when a new version shows up) and closed once every pin is current.
# Pins (Dockerfiles, lock files, versions.yaml) are never changed here: a bump
# is a reviewed change.
#
# A candidate is tested like a release: smoke test plus the cross-stack
# self-test against the pinned other stacks. Bugs of a specific upstream
# version listed in tests/known-bugs.tsv are reported as known rather than as
# failures. Shared steps: https://github.com/otfabric/.github/tree/main/actions.1.1
on:
  schedule:
    - cron: "39 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

env:
  BASE_REGISTRY: mirror.gcr.io/library
  TOOLS_REGISTRY: mirror.gcr.io

jobs:
  images:
    name: Base images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: otfabric/.github/actions/upstream-images@v3.1.1

  candidate:
    name: ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    # everest compiles libocpp twice (the pin and the candidate): about 30 minutes.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        adapter: [mobilityhouse, chargetime, lorenzodonini, everest, citrineos]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the pin against upstream
        id: resolve
        # bash: -eo pipefail, so a failing lookup fails this job too.
        shell: bash
        run: scripts/latest-upstream.py "${{ matrix.adapter }}" | tee -a "$GITHUB_OUTPUT"

      - name: Build and self-test at the latest release
        id: test
        if: steps.resolve.outputs.update == 'yes' && steps.resolve.outputs.built == 'yes'
        uses: otfabric/.github/actions/upstream-candidate@v3.1.1
        with:
          name: ${{ matrix.adapter }}
          pinned: ${{ steps.resolve.outputs.pin }}
          latest: ${{ steps.resolve.outputs.latest }}
          # The last summary line: the cross-stack self-test, or the smoke test when it stops there.
          result-pattern: '^\[(smoke|interop)\] [0-9]+ passed'
          command: >-
            make images &&
            make "candidate-${{ matrix.adapter }}"
            CANDIDATE_VERSION="${{ steps.resolve.outputs.latest }}"
            CANDIDATE_SHA="${{ steps.resolve.outputs.latest_sha }}"

      - name: Known bugs of the latest release
        id: known
        if: always()
        run: |
          known=$(awk -F'\t' -v a="${{ matrix.adapter }}" -v v="${{ steps.resolve.outputs.latest }}" \
            '!/^#/ { split($1, who, /[:@]/) } !/^#/ && who[1] == a && $2 == v { printf "%s%s", sep, $5; sep = "; " }' tests/known-bugs.tsv)
          echo "known=${known}" >> "$GITHUB_OUTPUT"

      - name: Table row
        if: always()
        uses: otfabric/.github/actions/upstream-row@v3.1.1
        with:
          component: ${{ matrix.adapter }}
          source: ${{ steps.resolve.outputs.source }}
          pinned: ${{ steps.resolve.outputs.pin }}
          latest: ${{ steps.resolve.outputs.latest }}
          update: ${{ steps.resolve.outputs.update }}
          detail: >-
            ${{ steps.resolve.outcome == 'failure' && 'upstream lookup failed (see the job log)'
            || steps.resolve.outputs.built == 'no' && 'planned: no adapter yet, pin is the latest: record in versions.yaml'
            || '' }}
          test-outcome: ${{ steps.test.outputs.outcome }}
          test-result: ${{ steps.test.outputs.result }}
          test-cached: ${{ steps.test.outputs.cached }}
          known: ${{ steps.known.outputs.known }}

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [images, candidate]
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: otfabric/.github/actions/upstream-report@v3.1.1
        with:
          needs: ${{ toJSON(needs) }}
          notes: |
            ### To update

            - **Built adapter:** move `ARG UPSTREAM_VERSION` (and `UPSTREAM_SHA`) in
              `adapters/<adapter>/Dockerfile`, its lock file and `versions.yaml`. Reproduce a
              candidate with `make candidate-<adapter> CANDIDATE_VERSION=<version>
              CANDIDATE_SHA=<commit>`; a `failure` needs the self-test log of the run first. A
              release that fails the self-tests stays a candidate: list its bug in
              `tests/known-bugs.tsv`.
            - **Planned adapter** (no Dockerfile yet): update `latest:` in `versions.yaml` and
              re-read what the new release claims about OCPP versions.
            - **Base image:** replace the digest in every file that pins it.
            - Record the change in `docs/COMPATIBILITY.md` and `RELEASE.md`.
