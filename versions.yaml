# Machine-readable version manifest for ocpp-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles are the source of truth for a build:
# scripts/check-versions.sh fails when this file disagrees with them.
#
# Phase 6: mobilityhouse, chargetime and lorenzodonini are built for OCPP
# 1.6J and 2.0.1, both roles; mobilityhouse also for OCPP 2.1. everest
# (EVerest libocpp) is a station for OCPP 1.6J, 2.0.1 and 2.1, and citrineos
# (CitrineOS) a CSMS for the same three.

interop_version: "0.8.0"
contract_version: "0.7"        # docs/CONTAINER_CONTRACT.md (draft until 1.0); documents carry schemaVersion "1.0"
fixture_schema: "1.0"          # fixtures/schema/ocpp-fixture.schema.json

protocol:
  name: "OCPP-J"
  versions: ["1.6", "2.0.1", "2.1"]
  subprotocols: ["ocpp1.6", "ocpp2.0.1", "ocpp2.1"]
  default_port: 9000           # inside the images; plain WebSocket, for test networks only
  path: "/ocpp/{station}"

implementations:
  mobilityhouse:
    priority: P0
    status: built
    upstream: "The Mobility House ocpp"
    repository: "https://github.com/mobilityhouse/ocpp"
    artifact: "pypi:ocpp"
    version: "2.1.0"             # 2025-07-16; the PyPI wheel is the tree of git tag 2.1.0
    revision: "91f4f89140a2198dc5a300cfea88d947ac91ae28"
    lock: "adapters/mobilityhouse/requirements.txt"   # every package by version and sha256
    transport: "websockets 17.2"   # the ocpp package has no transport of its own
    latest: "2.1.0"              # master has commits after it (last seen 2026-10-04)
    license: "MIT"               # its bundled OCA JSON schemas are CC BY-ND 4.0, used unmodified
    language: "Python"
    independent_engine: true
    roles: [server, client]
    versions_verified: ["1.6", "2.0.1", "2.1"]   # by the self-tests (scripts/smoke.sh, scripts/interop.sh)
    versions_claimed: ["1.6", "2.0.1", "2.1"]
    note: >-
      The README names 1.6 and 2.0.1 only; the ocpp/v21 package (since
      2.1.0) is verified by the self-tests, with two upstream defects
      (tests/known-bugs.tsv, docs/COMPATIBILITY.md). It knows the OCPP-J
      message types 2 to 4 only: no SEND, no CALLRESULTERROR.

  chargetime:
    priority: P0
    status: built
    upstream: "ChargeTimeEU Java-OCA-OCPP"
    repository: "https://github.com/ChargeTimeEU/Java-OCA-OCPP"
    artifact: "maven:eu.chargetime.ocpp:ocpp16j:2.0, maven:eu.chargetime.ocpp:ocpp2:2.0"   # Maven Central; their -sources jars are the tree of the tag
    version: "v2.0"              # 2025-12-12, git tag
    revision: "f27fe5bfb03e01491100597d6859080f5ae07545"
    lock: "adapters/chargetime/dependencies.sha256"   # every jar of the runtime class path by sha256
    latest: "v2.0"
    license: "MIT"
    language: "Java"
    independent_engine: true
    roles: [server, client]
    versions_verified: ["1.6", "2.0.1"]   # by the self-tests (scripts/smoke.sh, scripts/interop.sh)
    versions_claimed: ["1.6", "2.0.1", "2.1"]   # 2.1 on master only, unreleased
    note: >-
      1.6J in ocpp-v1_6 and ocpp-v1_6-json (artifacts ocpp16, ocpp16j); 2.0.1
      in the multi-protocol ocpp-v2 module (artifact ocpp2, package
      eu.chargetime.ocpp.v201, MultiProtocolJSONServer and
      MultiProtocolJSONClient). The v2.0 release has no OCPP 2.1 package:
      ocpp-v2 holds eu.chargetime.ocpp.v201 only, and Maven Central has no
      later ocpp2. master added eu.chargetime.ocpp.v21 with SEND and
      CALLRESULTERROR after v2.0 (febd153b, 2025-12-13; 31aea97a,
      2025-12-19), unreleased (last seen 2026-10-18).

  lorenzodonini:
    priority: P1
    status: built
    upstream: "lorenzodonini ocpp-go"
    repository: "https://github.com/lorenzodonini/ocpp-go"
    module: "github.com/lorenzodonini/ocpp-go"
    artifact: "go:github.com/lorenzodonini/ocpp-go@v0.19.0"   # from proxy.golang.org; the module is the tree of the tag
    version: "v0.19.0"           # 2025-02-02, git tag (the Go module version)
    revision: "a1eec917af884db0585752f909a61893aa667480"
    lock: "adapters/lorenzodonini/go.mod"   # with go.sum: every module by version and checksum
    transport: "gorilla/websocket 1.5.3 (through ocpp-go's ws package)"
    latest: "v0.19.0"
    license: "MIT"
    language: "Go"
    independent_engine: true
    roles: [server, client]
    versions_verified: ["1.6", "2.0.1"]   # by the self-tests (scripts/smoke.sh, scripts/interop.sh)
    versions_claimed: ["1.6", "2.0.1"]
    note: >-
      The upstream says its 2.0.1 support needs more real-world testing.
      No 2.1. The adapter uses ocpp-go's high-level API (ocpp16 and ocpp2
      packages) on its ocppj endpoints and ws transport.

  everest:
    priority: P1
    status: built
    upstream: "EVerest libocpp"
    repository: "https://github.com/EVerest/everest-core"
    artifact: "git:https://github.com/EVerest/everest-core@2026.02.2 (lib/everest/ocpp, log, timer, sqlite, evse_security)"
    version: "2026.02.2"         # 2026-11-05, git tag of everest-core; its libocpp is project version 0.31.1
    revision: "45dba2c049223d05beb7611c75d59f6639c46ee0"
    lock: "adapters/everest/Dockerfile"   # every source by tag and commit; Boost, OpenSSL, SQLite from Debian trixie
    transport: "libwebsockets 4.5.2 (through libocpp's ocpp::Websocket)"
    latest: "2026.02.2"          # the standalone EVerest/libocpp is archived (last release v0.31.1, 2025-12-11)
    license: "Apache-2.0"
    language: "C++"
    independent_engine: true
    roles: [client]              # libocpp implements the charging station only
    versions_verified: ["1.6", "2.0.1", "2.1"]   # by the self-tests (scripts/smoke.sh, scripts/interop.sh)
    versions_claimed: ["1.6", "2.0.1", "2.1"]
    note: >-
      libocpp moved from github.com/EVerest/libocpp (archived) into the
      everest-core monorepo, lib/everest/ocpp. The README says OCPP 2.1 is
      under development: its websocket subprotocol ocpp2.1 and every message
      (include/ocpp/v21/messages) are there. libocpp knows the OCPP-J
      message types 2 to 4 only (ocpp::MessageTypeId): no SEND, no
      CALLRESULTERROR. The adapter uses libocpp's protocol layer
      (ocpp::Websocket, ocpp::MessageQueue and the message types), not its
      ChargePoint, which runs a station of its own (adapters/everest/README.md).

  citrineos:
    priority: P2
    status: built
    upstream: "CitrineOS core"
    repository: "https://github.com/citrineos/citrineos-core"
    artifact: "git:https://github.com/citrineos/citrineos-core@v2.1.0 (apps/ocpp-server and the packages it deploys)"
    version: "v2.1.0"            # 2026-10-21, git tag (lightweight)
    revision: "4fd7599b91c2fb6e6065e7c9b94be69880cced27"
    lock: "pnpm-lock.yaml of the release"   # every npm package by version and integrity hash; pnpm 10.19.0 (packageManager)
    runtime: "PostgreSQL 15 with PostGIS 3 and RabbitMQ, Debian bookworm's, inside the container"
    transport: "ws 8.21.3 (through CitrineOS's WebsocketNetworkConnection)"
    latest: "v2.1.0"
    license: "Apache-2.0"
    language: "TypeScript"
    independent_engine: true
    roles: [server]              # a CSMS: CitrineOS has no charging station
    versions_verified: ["1.6", "2.0.1", "2.1"]   # by the self-tests (scripts/smoke.sh, scripts/interop.sh)
    versions_claimed: ["1.6", "2.0.1", "2.1"]
    note: >-
      A complete CSMS (an application, not a library): it answers every
      CALL itself, from its database and configuration, which the adapter
      fills from the fixture (stations, Basic authentication passwords, id
      tokens, the heartbeat interval). It needs PostgreSQL (PostGIS) and
      RabbitMQ; the image runs both next to it. CSMS CALLs go through its
      REST message API, which has no endpoint for most of the actions OCPP
      2.1 adds. It knows the OCPP-J message types 2 to 4 only: no SEND, no
      CALLRESULTERROR.

  cbsigma:
    priority: P2
    status: built
    upstream: "cB-Sigma/ocpp"
    repository: "https://github.com/cB-Sigma/ocpp"
    module: "github.com/cB-Sigma/ocpp"
    artifact: "go:github.com/cB-Sigma/ocpp@v0.2.0"   # from proxy.golang.org; the module is the tree of the tag
    version: "v0.2.0"            # 2026-10-11, git tag (the Go module version)
    revision: "5af4302fb9830c4dfbb6fea048ff62a6c3bbbb2d"
    lock: "adapters/cbsigma/go.mod"   # with go.sum: every module by version and checksum
    transport: "coder/websocket 1.8.15 (through cB-Sigma's ocpp.Conn)"
    latest: "v0.2.0"
    license: "Apache-2.0"
    language: "Go"
    independent_engine: true     # written from the OCPP documents (its PROVENANCE.md); no code of go-ocpp
    roles: [server, client]
    versions_verified: ["1.6", "2.0.1", "2.1"]   # by the self-tests (scripts/smoke.sh, scripts/interop.sh)
    versions_claimed: ["1.6", "2.0.1", "2.1"]
    note: >-
      A library with both roles (packages csms and chargepoint) and the
      OCPP 2.1 SEND and CALLRESULTERROR message types: the first reference
      here that has them. It checks every request and answer against the
      OCA schemas it embeds. A young project (two commits at v0.2.0); its
      own interop module runs mobilityhouse/ocpp, ocpp-go and
      seanlee0923/ocpp against it.

  ocppkit:
    priority: P2
    status: built
    upstream: "hupe1980/ocpp-kit"
    repository: "https://github.com/hupe1980/ocpp-kit"
    crate: "ocpp-kit"
    artifact: "crates:ocpp-kit@0.3.0"   # from crates.io; the crate is the tree of git tag v0.3.0 (.cargo_vcs_info.json)
    version: "0.3.0"             # 2026-09-15, crates.io (git tag v0.3.0)
    revision: "b64ce83ab46c742dfbd99e925cd0acfacbf2ddc9"
    lock: "adapters/ocppkit/Cargo.lock"   # every crate by version and checksum
    transport: "its own RFC 6455 WebSocket and RFC 7692 compression, rustls"
    latest: "0.3.0"
    license: "MIT OR Apache-2.0"
    language: "Rust"
    independent_engine: true     # its own codec, engine and WebSocket; no code of go-ocpp
    roles: [server, client]
    versions_verified: ["1.6", "2.0.1", "2.1"]   # by the self-tests (scripts/smoke.sh, scripts/interop.sh)
    versions_claimed: ["1.6", "2.0.1", "2.1"]
    note: >-
      A Rust toolkit with a station, a CSMS and a local controller, the
      OCPP 2.1 SEND and CALLRESULTERROR message types and permessage-deflate
      in both roles. Its station has security profiles 1 to 3 only (no
      connection without credentials), so its pairings run with HTTP Basic
      authentication (client.securityProfiles, contract 0.7). It has OCPP
      2.1 NotifyWebPaymentStarted in the wrong direction (not declared).

  seanlee:
    priority: P2
    status: built
    upstream: "seanlee0923/ocpp"
    repository: "https://github.com/seanlee0923/ocpp"
    module: "github.com/seanlee0923/ocpp"
    artifact: "go:github.com/seanlee0923/ocpp@v0.3.0"   # from proxy.golang.org; the module is the tree of the tag
    version: "v0.3.0"            # 2026-08-13, git tag (the Go module version)
    revision: "7e3759d106605a11e4e3f1ce45fc44e6f595cd3c"
    lock: "adapters/seanlee/go.mod"   # with go.sum: every module by version and checksum
    transport: "gorilla/websocket 1.5.3"
    latest: "v0.3.0"
    license: "MIT"
    language: "Go"
    independent_engine: true     # its own framing, routing and generated types; no code of go-ocpp
    roles: [server, client]
    versions_verified: ["1.6", "2.0.1", "2.1"]   # by the self-tests (scripts/smoke.sh, scripts/interop.sh)
    versions_claimed: ["1.6", "2.0.1", "2.1"]
    note: >-
      A Go library with a CSMS (package csms) and a station (package
      station), message types and validation generated from the OCA JSON
      schemas, security profiles 0 to 3. No compression, no CALLRESULTERROR;
      its CSMS takes OCPP 2.1 SENDs but neither role sends one. OCPP 1.6
      without the Security Whitepaper messages.

# OT Fabric's own stacks. Not independent implementations, not in a release of
# this repository or its manifest.json: see own/<library>/README.md.
own_implementations:
  otfabric:
    upstream: "go-ocpp"
    repository: "https://github.com/otfabric/go-ocpp"
    artifact: "go:github.com/otfabric/go-ocpp"
    version: "latest release, resolved when the image is built by hand"
    license: "MIT"
    language: "Go"
    independent_engine: false
    roles: [server, client]
    versions_claimed: ["1.6", "2.0.1", "2.1"]
    image: "ghcr.io/otfabric/ocpp-interop-otfabric"
    build: "own/go-ocpp"

base_images:
