images:
  mobilityhouse: "ghcr.io/otfabric/ocpp-interop-mobilityhouse"
  chargetime: "ghcr.io/otfabric/ocpp-interop-chargetime"
  lorenzodonini: "ghcr.io/otfabric/ocpp-interop-lorenzodonini"
  everest: "ghcr.io/otfabric/ocpp-interop-everest"
  citrineos: "ghcr.io/otfabric/ocpp-interop-citrineos"
  cbsigma: "ghcr.io/otfabric/ocpp-interop-cbsigma"
  ocppkit: "ghcr.io/otfabric/ocpp-interop-ocppkit"
  seanlee: "ghcr.io/otfabric/ocpp-interop-seanlee"

platforms: ["linux/amd64", "linux/arm64"]
